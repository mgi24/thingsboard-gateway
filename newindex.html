<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gateway UI</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Space+Grotesk:wght@400;600&display=swap");

    :root {
      --bg: #f4f1ea;
      --panel: #fffdf9;
      --ink: #1f1a17;
      --muted: #6a5f58;
      --accent: #d9822b;
      --accent-dark: #b46a22;
      --line: #e5ddd2;
      --ok: #2e7d32;
      --bad: #b00020;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Space Grotesk", "Segoe UI", sans-serif;
      color: var(--ink);
      background: radial-gradient(1200px 600px at 10% -10%, #f9f1dc, var(--bg));
      min-height: 100vh;
    }

    .layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      background: #201a16;
      color: #f2e8dc;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .brand {
      font-family: "Fraunces", "Times New Roman", serif;
      font-size: 22px;
      letter-spacing: 0.5px;
    }

    .nav a {
      display: block;
      color: #f2e8dc;
      text-decoration: none;
      padding: 10px 12px;
      border-radius: 10px;
      transition: all 0.2s ease;
    }

    .nav a.active,
    .nav a:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .content {
      padding: 28px 32px 40px;
    }

    h1 {
      margin: 0;
      font-family: "Fraunces", "Times New Roman", serif;
      font-size: 28px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 600;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .split {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 18px;
      align-items: start;
    }

    .split.full {
      grid-template-columns: 1fr;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(32, 26, 22, 0.08);
      animation: fadeUp 0.4s ease;
    }

    .message {
      margin: 10px 0 16px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff8ef;
      font-weight: 600;
      display: none;
    }

    .message.success {
      border-color: #cfe6d3;
      background: #eff8f1;
      color: var(--ok);
    }

    .message.error {
      border-color: #f2c0c0;
      background: #fff0f0;
      color: var(--bad);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      text-align: left;
      padding: 10px 8px;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }

    th {
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 12px;
      color: var(--muted);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid transparent;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #999;
    }

    .online {
      color: var(--ok);
      background: #e8f5e9;
      border-color: #cfe6d3;
    }

    .online .dot {
      background: var(--ok);
    }

    .offline {
      color: var(--bad);
      background: #ffe9e9;
      border-color: #f2c0c0;
    }

    .offline .dot {
      background: var(--bad);
    }

    form {
      display: grid;
      gap: 12px;
    }

    label {
      font-weight: 600;
      font-size: 13px;
    }

    input {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      font-size: 14px;
    }

    .form-row {
      display: grid;
      gap: 6px;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      background: var(--accent);
      color: #1a120c;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .btn:hover {
      background: var(--accent-dark);
      transform: translateY(-1px);
    }

    .btn.secondary {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink);
    }

    .btn.secondary:hover {
      background: #f4ede4;
    }

    .btn.inline {
      padding: 6px 10px;
      font-size: 13px;
    }

    .btn[disabled] {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .hidden {
      display: none;
    }

    .ts-list {
      display: grid;
      gap: 6px;
    }

    .ts-item {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 13px;
    }

    .ts-error {
      color: var(--bad);
      font-weight: 600;
    }

    .ts-pulse {
      animation: pulseGray 1s ease;
      border-radius: 6px;
      padding: 2px 4px;
      background: #eeeeee;
    }

    .ts-row {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .ts-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .ts-controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .breadcrumb {
      color: var(--muted);
      margin-top: 6px;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulseGray {
      0% {
        background: #dcdcdc;
      }

      100% {
        background: transparent;
      }
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }

      .split {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">Gateway UI</div>
      <nav class="nav">
        <a href="#modbus" id="nav-modbus">Modbus</a>
        <a href="#settings" id="nav-settings">Settings</a>
      </nav>
    </aside>
    <main class="content">
      <section id="section-settings">
        <div class="page-header">
          <h1>Settings</h1>
        </div>

        <div id="settings-message" class="message"></div>

        <section class="panel" style="max-width: 560px;">
          <form id="settings-form">
            <div class="form-row">
              <label for="tb_ip">Thingsboard IP</label>
              <input id="tb_ip" name="tb_ip" type="text" />
            </div>
            <div class="form-row">
              <label for="tb_port">Port</label>
              <input id="tb_port" name="tb_port" type="number" min="1" max="65535" />
            </div>
            <div class="form-row">
              <label for="tb_user">Username</label>
              <input id="tb_user" name="tb_user" type="text" />
            </div>
            <div class="form-row">
              <label for="tb_pass">Password</label>
              <div style="display: flex; gap: 8px; align-items: center;">
                <input id="tb_pass" name="tb_pass" type="password" style="flex: 1;" />
                <button class="btn secondary inline" id="toggle-pass" type="button">
                  Show
                </button>
              </div>
            </div>
            <h2 style="margin-top: 16px;">RPC Settings (Gateway)</h2>
            <div class="form-row">
              <label for="tb_rpc_port">MQTT RPC Port</label>
              <input id="tb_rpc_port" name="tb_rpc_port" type="number" min="1" max="65535" value="1883" />
            </div>
            <div class="form-row">
              <label for="tb_rpc_token">Gateway Access Token</label>
              <input id="tb_rpc_token" name="tb_rpc_token" type="text" />
            </div>
            <div class="form-actions" style="margin-top: 16px;">
              <button class="btn" id="settings-save" type="button">Save</button>
              <button class="btn secondary" id="settings-test" type="button">Test HTTP</button>
              <button class="btn secondary" id="settings-test-rpc" type="button">Test RPC</button>
            </div>
          </form>
        </section>
      </section>

      <section id="section-modbus" class="hidden">
        <div class="page-header">
          <h1>Modbus</h1>
          <button class="btn" id="modbus-add">Add Modbus TCP Connectors</button>
        </div>

        <div id="modbus-message" class="message"></div>

        <div class="split full" id="modbus-split">
          <section class="panel">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>IP</th>
                  <th>Port</th>
                  <th>Status</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody id="modbus-table-body"></tbody>
            </table>
          </section>

          <section class="panel hidden" id="modbus-form-panel">
            <h2 id="modbus-form-title">Add Modbus TCP Connector</h2>
            <form id="modbus-form">
              <input type="hidden" id="modbus-id" />
              <div class="form-row">
                <label for="modbus-name">Name</label>
                <input id="modbus-name" name="modbus-name" type="text" />
              </div>
              <div class="form-row">
                <label for="modbus-ip">IP</label>
                <input id="modbus-ip" name="modbus-ip" type="text" />
              </div>
              <div class="form-row">
                <label for="modbus-port">Port</label>
                <input id="modbus-port" name="modbus-port" type="number" min="1" max="65535" />
              </div>
              <div class="form-actions">
                <button class="btn" id="modbus-save" type="button">Save</button>
                <button class="btn secondary" id="modbus-cancel" type="button">
                  Cancel
                </button>
              </div>
            </form>
          </section>
        </div>
      </section>

      <section id="section-device" class="hidden">
        <div class="page-header">
          <div>
            <h1>Device List</h1>
            <div class="breadcrumb" id="device-breadcrumb">Modbus</div>
          </div>
          <div class="form-actions">
            <button class="btn" id="device-add" type="button">Add Device</button>
            <button class="btn secondary" id="device-back" type="button">Back</button>
          </div>
        </div>

        <div id="device-message" class="message"></div>

        <div class="split" id="device-split">
          <section class="panel hidden" id="device-form-panel">
            <h2 id="device-form-title">Add Device</h2>
            <form id="device-form">
              <input type="hidden" id="device-id" />
              <div class="form-row">
                <label for="device-name">Device Name</label>
                <input id="device-name" name="device-name" type="text" />
              </div>
              <div class="form-row">
                <label for="device-unit">Unit ID</label>
                <input id="device-unit" name="device-unit" type="number" min="1" />
              </div>
              <div class="form-row">
                <label for="device-token">Thingsboard Access Token (optional)</label>
                <div style="display: flex; gap: 8px; align-items: center;">
                  <input id="device-token" name="device-token" type="text" style="flex: 1;" />
                  <button class="btn secondary inline" id="device-token-test" type="button">Test Token</button>
                </div>
                <div id="device-token-message" class="message" style="margin: 4px 0 0;"></div>
              </div>

              <div class="form-row">
                <label>Timeseries Data</label>
                <div class="ts-list" id="timeseries-list"></div>
                <button class="btn secondary inline" id="timeseries-add" type="button">
                  Add Timeseries
                </button>
              </div>

              <div class="form-actions">
                <button class="btn" id="device-save" type="button">Save</button>
                <button class="btn secondary" id="device-cancel" type="button">
                  Cancel
                </button>
              </div>
            </form>
          </section>

          <section class="panel">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Unit ID</th>
                  <th>Token</th>
                  <th>Data</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody id="device-table-body"></tbody>
            </table>
          </section>
        </div>
      </section>
    </main>
  </div>

  <script>
    const sectionSettings = document.getElementById("section-settings");
    const sectionModbus = document.getElementById("section-modbus");
    const sectionDevice = document.getElementById("section-device");
    const navSettings = document.getElementById("nav-settings");
    const navModbus = document.getElementById("nav-modbus");

    const settingsMessage = document.getElementById("settings-message");
    const modbusMessage = document.getElementById("modbus-message");

    const settingsSaveBtn = document.getElementById("settings-save");
    const settingsTestBtn = document.getElementById("settings-test");
    const settingsTestRpcBtn = document.getElementById("settings-test-rpc");
    const togglePassBtn = document.getElementById("toggle-pass");

    const modbusAddBtn = document.getElementById("modbus-add");
    const modbusSaveBtn = document.getElementById("modbus-save");
    const modbusCancelBtn = document.getElementById("modbus-cancel");
    const modbusTableBody = document.getElementById("modbus-table-body");
    const modbusFormTitle = document.getElementById("modbus-form-title");
    const modbusSplit = document.getElementById("modbus-split");
    const modbusFormPanel = document.getElementById("modbus-form-panel");

    const deviceMessage = document.getElementById("device-message");
    const deviceAddBtn = document.getElementById("device-add");
    const deviceBackBtn = document.getElementById("device-back");
    const deviceFormPanel = document.getElementById("device-form-panel");
    const deviceFormTitle = document.getElementById("device-form-title");
    const deviceTableBody = document.getElementById("device-table-body");
    const deviceSplit = document.getElementById("device-split");
    const deviceBreadcrumb = document.getElementById("device-breadcrumb");
    const deviceSaveBtn = document.getElementById("device-save");
    const deviceCancelBtn = document.getElementById("device-cancel");
    const deviceTokenTestBtn = document.getElementById("device-token-test");
    const deviceTokenMessage = document.getElementById("device-token-message");
    const timeseriesList = document.getElementById("timeseries-list");
    const timeseriesAddBtn = document.getElementById("timeseries-add");

    let modbusItems = [];
    let modbusEditingId = null;
    let modbusPolling = false;
    let deviceItems = [];
    let devicePolling = false;
    let deviceEditingId = null;
    let currentView = "settings";
    let currentModbusId = null;
    let currentModbusName = "";

    function showMessage(target, text, type) {
      target.textContent = text;
      target.className = `message ${type}`;
      target.style.display = "block";
    }

    function clearMessage(target) {
      target.textContent = "";
      target.style.display = "none";
    }

    function setActiveSection(section) {
      const isSettings = section === "settings";
      const isModbus = section === "modbus";
      const isDevice = section === "device";
      currentView = section;

      sectionSettings.classList.toggle("hidden", !isSettings);
      sectionModbus.classList.toggle("hidden", !isModbus);
      sectionDevice.classList.toggle("hidden", !isDevice);

      navSettings.classList.toggle("active", isSettings);
      navModbus.classList.toggle("active", isModbus || isDevice);

      if (isModbus) {
        refreshModbusList();
      }
      if (isDevice) {
        refreshDeviceList();
      }
    }

    function applyHash() {
      const hash = window.location.hash || "#settings";
      if (hash === "#modbus") {
        setActiveSection("modbus");
        return;
      }
      if (hash.startsWith("#device-")) {
        const idText = hash.replace("#device-", "");
        const parsedId = Number(idText);
        if (Number.isFinite(parsedId) && parsedId > 0) {
          openDevicePage(parsedId, null, false);
          return;
        }
      }
      setActiveSection("settings");
    }

    window.addEventListener("hashchange", applyHash);
    applyHash();

    togglePassBtn.addEventListener("click", () => {
      const passInput = document.getElementById("tb_pass");
      const isPassword = passInput.type === "password";
      passInput.type = isPassword ? "text" : "password";
      togglePassBtn.textContent = isPassword ? "Hide" : "Show";
    });

    function settingsPayload() {
      return {
        tb_ip: document.getElementById("tb_ip").value.trim(),
        tb_port: document.getElementById("tb_port").value.trim(),
        tb_user: document.getElementById("tb_user").value.trim(),
        tb_pass: document.getElementById("tb_pass").value,
        tb_rpc_port: document.getElementById("tb_rpc_port").value.trim(),
        tb_rpc_token: document.getElementById("tb_rpc_token").value.trim(),
      };
    }

    async function loadSettings() {
      try {
        const response = await fetch("/api/settings");
        if (!response.ok) {
          throw new Error("Gagal memuat settings.");
        }
        const data = await response.json();
        document.getElementById("tb_ip").value = data.tb_ip || "";
        document.getElementById("tb_port").value = data.tb_port || "";
        document.getElementById("tb_user").value = data.tb_user || "";
        document.getElementById("tb_pass").value = data.tb_pass || "";
        document.getElementById("tb_rpc_port").value = data.tb_rpc_port || "1883";
        document.getElementById("tb_rpc_token").value = data.tb_rpc_token || "";
      } catch (err) {
        showMessage(settingsMessage, err.message || "Gagal memuat settings.", "error");
      }
    }

    let settingsMsgTimer = null;

    function showSettingsMessage(text, type) {
      clearTimeout(settingsMsgTimer);
      showMessage(settingsMessage, text, type);
      settingsMsgTimer = setTimeout(() => clearMessage(settingsMessage), 5000);
    }

    async function sendSettings(endpoint, label) {
      settingsSaveBtn.disabled = true;
      settingsTestBtn.disabled = true;
      const origSave = settingsSaveBtn.textContent;
      const origTest = settingsTestBtn.textContent;
      if (label === "save") settingsSaveBtn.textContent = "Menyimpan\u2026";
      else settingsTestBtn.textContent = "Testing\u2026";
      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(settingsPayload()),
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || "Terjadi kesalahan.");
        }
        showSettingsMessage(data.message || "Berhasil.", "success");
      } catch (err) {
        showSettingsMessage(err.message || "Terjadi kesalahan.", "error");
      } finally {
        settingsSaveBtn.disabled = false;
        settingsTestBtn.disabled = false;
        settingsTestRpcBtn.disabled = false;
        settingsSaveBtn.textContent = origSave;
        settingsTestBtn.textContent = origTest;
        if (label === "test-rpc") settingsTestRpcBtn.textContent = "Test RPC";
      }
    }

    settingsSaveBtn.addEventListener("click", () => sendSettings("/api/settings/save", "save"));
    settingsTestBtn.addEventListener("click", () => sendSettings("/api/settings/test", "test"));
    settingsTestRpcBtn.addEventListener("click", () => sendSettings("/api/settings/test-rpc", "test-rpc"));

    function setModbusForm(data) {
      document.getElementById("modbus-id").value = data.id || "";
      document.getElementById("modbus-name").value = data.name || "";
      document.getElementById("modbus-ip").value = data.ip || "";
      document.getElementById("modbus-port").value = data.port || "";
      modbusEditingId = data.id || null;
      modbusFormTitle.textContent = modbusEditingId
        ? "Edit Modbus TCP Connector"
        : "Add Modbus TCP Connector";
    }

    function setModbusFormVisible(isVisible) {
      modbusFormPanel.classList.toggle("hidden", !isVisible);
      modbusSplit.classList.toggle("full", !isVisible);
    }

    function renderModbusTable(items) {
      modbusTableBody.innerHTML = "";
      if (!items.length) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");
        cell.colSpan = 5;
        cell.textContent = "Belum ada data Modbus TCP Connector.";
        row.appendChild(cell);
        modbusTableBody.appendChild(row);
        return;
      }

      items.forEach((item) => {
        const row = document.createElement("tr");

        const nameCell = document.createElement("td");
        nameCell.textContent = item.name || "";

        const ipCell = document.createElement("td");
        ipCell.textContent = item.ip;

        const portCell = document.createElement("td");
        portCell.textContent = item.port;

        const statusCell = document.createElement("td");
        const statusWrap = document.createElement("span");
        statusWrap.className = `status ${item.online ? "online" : "offline"}`;
        const dot = document.createElement("span");
        dot.className = "dot";
        statusWrap.appendChild(dot);
        statusWrap.appendChild(document.createTextNode(item.online ? "ON" : "OFF"));
        statusCell.appendChild(statusWrap);

        const actionCell = document.createElement("td");
        const editBtn = document.createElement("button");
        editBtn.className = "btn secondary inline";
        editBtn.dataset.action = "edit";
        editBtn.dataset.id = item.id;
        editBtn.type = "button";
        editBtn.textContent = "Edit";

        const deviceBtn = document.createElement("button");
        deviceBtn.className = "btn secondary inline";
        deviceBtn.dataset.action = "device";
        deviceBtn.dataset.id = item.id;
        deviceBtn.type = "button";
        deviceBtn.textContent = "Device";

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "btn secondary inline";
        deleteBtn.dataset.action = "delete";
        deleteBtn.dataset.id = item.id;
        deleteBtn.type = "button";
        deleteBtn.textContent = "Delete";

        actionCell.appendChild(editBtn);
        actionCell.appendChild(deviceBtn);
        actionCell.appendChild(deleteBtn);

        row.appendChild(nameCell);
        row.appendChild(ipCell);
        row.appendChild(portCell);
        row.appendChild(statusCell);
        row.appendChild(actionCell);

        modbusTableBody.appendChild(row);
      });
    }

    async function refreshModbusList() {
      if (currentView !== "modbus") {
        return;
      }
      if (modbusPolling) {
        return;
      }
      modbusPolling = true;
      try {
        const response = await fetch("/api/modbus");
        if (!response.ok) {
          throw new Error("Gagal memuat Modbus.");
        }
        const data = await response.json();
        modbusItems = data.items || [];
        renderModbusTable(modbusItems);
      } catch (err) {
        showMessage(modbusMessage, err.message || "Gagal memuat Modbus.", "error");
      } finally {
        modbusPolling = false;
      }
    }

    async function saveModbus() {
      clearMessage(modbusMessage);
      const payload = {
        id: document.getElementById("modbus-id").value || null,
        name: document.getElementById("modbus-name").value.trim(),
        ip: document.getElementById("modbus-ip").value.trim(),
        port: document.getElementById("modbus-port").value.trim(),
      };

      try {
        const response = await fetch("/api/modbus/save", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || "Terjadi kesalahan.");
        }
        showMessage(modbusMessage, data.message || "Data tersimpan.", "success");
        setModbusForm({ id: "", name: "", ip: "", port: "" });
        setModbusFormVisible(false);
        refreshModbusList();
      } catch (err) {
        showMessage(modbusMessage, err.message || "Terjadi kesalahan.", "error");
      }
    }

    async function deleteModbus(id) {
      if (!confirm("Hapus data ini?")) {
        return;
      }
      try {
        const response = await fetch("/api/modbus/delete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id }),
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || "Terjadi kesalahan.");
        }
        showMessage(modbusMessage, data.message || "Data terhapus.", "success");
        refreshModbusList();
      } catch (err) {
        showMessage(modbusMessage, err.message || "Terjadi kesalahan.", "error");
      }
    }

    modbusTableBody.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) {
        return;
      }
      const action = button.dataset.action;
      const id = Number(button.dataset.id);
      const item = modbusItems.find((row) => row.id === id);
      if (!item) {
        return;
      }
      if (action === "edit") {
        setActiveSection("modbus");
        setModbusForm({
          id: item.id,
          name: item.name,
          ip: item.ip,
          port: item.port,
        });
        setModbusFormVisible(true);
      } else if (action === "delete") {
        deleteModbus(item.id);
      } else if (action === "device") {
        openDevicePage(item.id, item.name, true);
      }
    });

    modbusAddBtn.addEventListener("click", () => {
      window.location.hash = "#modbus";
      setModbusForm({ id: "", name: "", ip: "", port: "" });
      setModbusFormVisible(true);
    });

    modbusSaveBtn.addEventListener("click", saveModbus);
    modbusCancelBtn.addEventListener("click", () => {
      setModbusForm({ id: "", name: "", ip: "", port: "" });
      setModbusFormVisible(false);
    });

    function updateDeviceBreadcrumb() {
      if (currentModbusName) {
        deviceBreadcrumb.textContent = `Modbus > ${currentModbusName}`;
      } else {
        deviceBreadcrumb.textContent = "Modbus";
      }
    }

    async function openDevicePage(modbusId, modbusName, updateHash) {
      currentModbusId = modbusId;
      currentModbusName = modbusName || "";
      updateDeviceBreadcrumb();

      if (!currentModbusName) {
        try {
          const response = await fetch(`/api/modbus/${modbusId}`);
          if (response.ok) {
            const data = await response.json();
            currentModbusName = data.name || "";
            updateDeviceBreadcrumb();
          }
        } catch (err) {
          // ignore
        }
      }

      if (updateHash) {
        window.location.hash = `#device-${modbusId}`;
      }
      setDeviceFormVisible(false);
      setActiveSection("device");
    }

    function setDeviceFormVisible(isVisible) {
      deviceFormPanel.classList.toggle("hidden", !isVisible);
      deviceSplit.classList.toggle("full", !isVisible);
    }

    function buildOptions(options, selected) {
      return options
        .map((opt) => {
          const isSelected = String(opt.value) === String(selected);
          return `<option value="${opt.value}" ${isSelected ? "selected" : ""}>${opt.label}</option>`;
        })
        .join("");
    }

    function createTimeseriesRow(data = {}) {
      const row = document.createElement("div");
      row.className = "ts-row";
      row.dataset.id = data.id || "";

      row.innerHTML = `
          <div class="ts-grid">
            <div class="form-row">
              <label>Key Name</label>
              <input class="ts-key" type="text" />
            </div>
            <div class="form-row">
              <label>Type</label>
              <select class="ts-type"></select>
            </div>
            <div class="form-row">
              <label>Function</label>
              <select class="ts-function"></select>
            </div>
            <div class="form-row">
              <label>Object Count</label>
              <input class="ts-count" type="number" min="1" />
            </div>
            <div class="form-row">
              <label>Register Address</label>
              <input class="ts-address" type="number" min="1" />
            </div>
          </div>
          <div class="ts-controls">
            <label>
              <input type="checkbox" class="ts-modifier-on" /> Modifier
            </label>
            <select class="ts-modifier-type">
              <option value="divider">Divider</option>
              <option value="multiplier">Multiplier</option>
            </select>
            <input class="ts-modifier-value" type="number" step="0.0001" placeholder="Value" />
            <label>
              <input type="checkbox" class="ts-pull-on" /> Pull strategy
            </label>
            <input class="ts-report" type="number" min="1" placeholder="Report ms" />
            <button class="btn secondary inline ts-remove" type="button">Remove</button>
          </div>
        `;

      const typeOptions = [
        "string",
        "bytes",
        "bits",
        "8int",
        "8uint",
        "16int",
        "16uint",
        "16float",
        "32int",
        "32uint",
        "32float",
        "64int",
        "64uint",
        "64float",
      ].map((value) => ({ value, label: value }));

      const functionOptions = [
        { value: 3, label: "3 Read multiple holding register" },
        { value: 4, label: "4 Read input register" },
        { value: 1, label: "1 Read coils" },
        { value: 2, label: "2 Read discrete input" },
      ];

      const typeSelect = row.querySelector(".ts-type");
      const functionSelect = row.querySelector(".ts-function");
      typeSelect.innerHTML = buildOptions(typeOptions, data.data_type || "string");
      functionSelect.innerHTML = buildOptions(functionOptions, data.function_code || 3);

      row.querySelector(".ts-key").value = data.key_name || "";
      row.querySelector(".ts-count").value = data.object_count || "";
      row.querySelector(".ts-address").value = data.register_address || "";

      const modifierOn = row.querySelector(".ts-modifier-on");
      const modifierType = row.querySelector(".ts-modifier-type");
      const modifierValue = row.querySelector(".ts-modifier-value");
      const pullOn = row.querySelector(".ts-pull-on");
      const reportField = row.querySelector(".ts-report");

      modifierOn.checked = Boolean(data.modifier_on);
      modifierType.value = data.modifier_type || "divider";
      modifierValue.value = data.modifier_value ?? "";
      pullOn.checked = Boolean(data.pull_on);
      reportField.value = data.report_period_ms ?? "";

      function updateRowState() {
        const modOn = modifierOn.checked;
        modifierType.disabled = !modOn;
        modifierValue.disabled = !modOn;
        const pull = pullOn.checked;
        reportField.disabled = !pull;
      }

      modifierOn.addEventListener("change", updateRowState);
      pullOn.addEventListener("change", updateRowState);
      updateRowState();

      row.querySelector(".ts-remove").addEventListener("click", () => {
        row.remove();
      });

      return row;
    }

    function setDeviceForm(data) {
      document.getElementById("device-id").value = data.id || "";
      document.getElementById("device-name").value = data.name || "";
      document.getElementById("device-unit").value = data.unit_id || "";
      document.getElementById("device-token").value = data.tb_token || "";
      deviceEditingId = data.id || null;
      deviceFormTitle.textContent = deviceEditingId ? "Edit Device" : "Add Device";

      timeseriesList.innerHTML = "";
      const list = data.timeseries || [];
      if (list.length === 0) {
        timeseriesList.appendChild(createTimeseriesRow());
      } else {
        list.forEach((ts) => timeseriesList.appendChild(createTimeseriesRow(ts)));
      }
    }

    function collectTimeseries() {
      const rows = Array.from(timeseriesList.querySelectorAll(".ts-row"));
      return rows.map((row) => ({
        id: row.dataset.id || null,
        key_name: row.querySelector(".ts-key").value.trim(),
        data_type: row.querySelector(".ts-type").value,
        function_code: Number(row.querySelector(".ts-function").value),
        object_count: row.querySelector(".ts-count").value,
        register_address: row.querySelector(".ts-address").value,
        modifier_on: row.querySelector(".ts-modifier-on").checked,
        modifier_type: row.querySelector(".ts-modifier-type").value,
        modifier_value: row.querySelector(".ts-modifier-value").value,
        pull_on: row.querySelector(".ts-pull-on").checked,
        report_period_ms: row.querySelector(".ts-report").value,
      }));
    }

    function renderDeviceTable(items) {
      deviceTableBody.innerHTML = "";
      if (!items.length) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");
        cell.colSpan = 5;
        cell.textContent = "Belum ada device.";
        row.appendChild(cell);
        deviceTableBody.appendChild(row);
        return;
      }

      items.forEach((item) => {
        const row = document.createElement("tr");
        const nameCell = document.createElement("td");
        nameCell.textContent = item.name;

        const unitCell = document.createElement("td");
        unitCell.textContent = item.unit_id;

        const tokenCell = document.createElement("td");
        tokenCell.textContent = item.tb_token || "";

        const dataCell = document.createElement("td");
        const tsWrap = document.createElement("div");
        tsWrap.className = "ts-list";
        (item.timeseries || []).forEach((ts) => {
          const line = document.createElement("div");
          line.className = "ts-item";
          const value = ts.last_value ?? "-";
          const label = `${ts.key_name} (addr ${ts.register_address})`;
          const valueSpan = document.createElement("span");
          valueSpan.textContent = `= ${value}`;
          if (ts.last_status && ts.last_status !== "ok") {
            valueSpan.classList.add("ts-error");
          }
          line.appendChild(document.createTextNode(label));
          line.appendChild(valueSpan);
          tsWrap.appendChild(line);
        });
        dataCell.appendChild(tsWrap);

        const actionCell = document.createElement("td");
        const editBtn = document.createElement("button");
        editBtn.className = "btn secondary inline";
        editBtn.dataset.action = "edit";
        editBtn.dataset.id = item.id;
        editBtn.type = "button";
        editBtn.textContent = "Edit";

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "btn secondary inline";
        deleteBtn.dataset.action = "delete";
        deleteBtn.dataset.id = item.id;
        deleteBtn.type = "button";
        deleteBtn.textContent = "Delete";

        actionCell.appendChild(editBtn);
        actionCell.appendChild(deleteBtn);

        row.appendChild(nameCell);
        row.appendChild(unitCell);
        row.appendChild(tokenCell);
        row.appendChild(dataCell);
        row.appendChild(actionCell);
        deviceTableBody.appendChild(row);
      });
    }

    async function refreshDeviceList() {
      if (currentView !== "device" || !currentModbusId) {
        return;
      }
      if (devicePolling) {
        return;
      }
      devicePolling = true;
      try {
        const response = await fetch(`/api/modbus/${currentModbusId}/devices`);
        if (!response.ok) {
          throw new Error("Gagal memuat device.");
        }
        const data = await response.json();
        deviceItems = data.items || [];
        renderDeviceTable(deviceItems);
      } catch (err) {
        showMessage(deviceMessage, err.message || "Gagal memuat device.", "error");
      } finally {
        devicePolling = false;
      }
    }

    async function loadDeviceDetail(deviceId) {
      try {
        const response = await fetch(`/api/devices/${deviceId}`);
        if (!response.ok) {
          throw new Error("Device tidak ditemukan.");
        }
        const data = await response.json();
        setDeviceForm(data);
        setDeviceFormVisible(true);
      } catch (err) {
        showMessage(deviceMessage, err.message || "Gagal memuat device.", "error");
      }
    }

    async function saveDevice() {
      clearMessage(deviceMessage);
      const payload = {
        id: document.getElementById("device-id").value || null,
        modbus_id: currentModbusId,
        name: document.getElementById("device-name").value.trim(),
        unit_id: document.getElementById("device-unit").value,
        tb_token: document.getElementById("device-token").value.trim(),
        timeseries: collectTimeseries(),
      };

      try {
        const response = await fetch("/api/devices/save", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || "Terjadi kesalahan.");
        }
        showMessage(deviceMessage, data.message || "Device tersimpan.", "success");
        setDeviceForm({ id: "", name: "", unit_id: "", tb_token: "", timeseries: [] });
        setDeviceFormVisible(false);
        refreshDeviceList();
      } catch (err) {
        showMessage(deviceMessage, err.message || "Terjadi kesalahan.", "error");
      }
    }

    async function deleteDevice(id) {
      if (!confirm("Hapus device ini?")) {
        return;
      }
      try {
        const response = await fetch("/api/devices/delete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id }),
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || "Terjadi kesalahan.");
        }
        showMessage(deviceMessage, data.message || "Device terhapus.", "success");
        refreshDeviceList();
      } catch (err) {
        showMessage(deviceMessage, err.message || "Terjadi kesalahan.", "error");
      }
    }

    deviceTableBody.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) {
        return;
      }
      const action = button.dataset.action;
      const id = Number(button.dataset.id);
      if (action === "edit") {
        loadDeviceDetail(id);
      } else if (action === "delete") {
        deleteDevice(id);
      }
    });

    deviceAddBtn.addEventListener("click", () => {
      setDeviceForm({ id: "", name: "", unit_id: "", tb_token: "", timeseries: [] });
      setDeviceFormVisible(true);
    });

    deviceBackBtn.addEventListener("click", () => {
      window.location.hash = "#modbus";
      setActiveSection("modbus");
    });

    deviceSaveBtn.addEventListener("click", saveDevice);
    deviceCancelBtn.addEventListener("click", () => {
      setDeviceForm({ id: "", name: "", unit_id: "", tb_token: "", timeseries: [] });
      setDeviceFormVisible(false);
    });

    timeseriesAddBtn.addEventListener("click", () => {
      timeseriesList.appendChild(createTimeseriesRow());
    });

    deviceTokenTestBtn.addEventListener("click", async () => {
      const token = document.getElementById("device-token").value.trim();
      clearMessage(deviceTokenMessage);
      if (!token) {
        showMessage(deviceTokenMessage, "Isi access token terlebih dahulu.", "error");
        return;
      }
      deviceTokenTestBtn.disabled = true;
      deviceTokenTestBtn.textContent = "Testing...";
      try {
        const response = await fetch("/api/devices/test-token", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ tb_token: token }),
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || "Terjadi kesalahan.");
        }
        showMessage(deviceTokenMessage, data.message || "Berhasil.", "success");
        setTimeout(() => clearMessage(deviceTokenMessage), 5000);
      } catch (err) {
        showMessage(deviceTokenMessage, err.message || "Terjadi kesalahan.", "error");
        setTimeout(() => clearMessage(deviceTokenMessage), 5000);
      } finally {
        deviceTokenTestBtn.disabled = false;
        deviceTokenTestBtn.textContent = "Test Token";
      }
    });

    loadSettings();
    setModbusForm({ id: "", name: "", ip: "", port: "" });
    setModbusFormVisible(false);
    setDeviceForm({ id: "", name: "", unit_id: "", tb_token: "", timeseries: [] });
    setDeviceFormVisible(false);
    refreshModbusList();
    setInterval(refreshModbusList, 1000);
    setInterval(refreshDeviceList, 1000);
  </script>
</body>

</html>
